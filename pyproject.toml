[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"
[project]
name = "iris-pilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]==3.2.6", "shapely==2.0.7", "reportlab==4.3.1", "pypdf==5.3.1", "pytest==8.3.5"]
[project.scripts]
iris = "iris.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
